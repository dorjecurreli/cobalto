app:
  about-us:
    title: About Us
    p-1: COBALTO is an experiment that originates as an idea of a
      "magazine/anthology" for the dissemination of experimental poetry.
      Not printed pages, but something different, something that goes beyond
      the magazine itself— a collective artistic expression without the
      mediation of "reproducibility," but with the uniqueness of a living work,
      a container to show how poetry can exist in a world where it seems
      superfluous.
      For this reason, we set out to create a collective work, in numbered copies,
      composed only of originals.
      Despite some differences from the initial request, the idea of producing
      a collection of originals that would form a series of unique compilations
      has generally been embraced and respected.
    vision: Our Vision
    p-2: For this reason, we set out to create a collective work, in numbered copies, composed entirely of originals. Although there were some differences from the initial request, in general, the idea of producing a collection of originals that would form a series of unique compilations was accepted and respected.
  contacts: Contact us
  artwork: Artwork
  events: Events
  artists: Artists




